{{- if not .Values.prometheusRules.ruleGroups.generic }}
groups: []
{{- else -}}
groups:
- name: generic
  rules:
{{- if not (.Values.prometheusRules.disabled.CephDaemonCrash | default false) }}
  - alert: CephDaemonCrash
    expr: ceph_health_detail{name="RECENT_CRASH"} == 1
    for: 1m
    labels:
      service: ceph
      oid: "1.3.6.1.4.1.50495.1.2.1.1.2"
      severity: critical
      type: ceph_default
      {{- include "cloud-storage-operations.additionalRuleLabels" . | nindent 6 }}
    annotations:
      description: "One or more daemons have crashed recently, and need to be acknowledged. This notification ensures that software crashes do not go unseen. To acknowledge a crash, use the 'ceph crash archive <id>' command."
      documentation: "https://docs.ceph.com/en/latest/rados/operations/health-checks/#recent-crash"
      summary: "One or more Ceph daemons have crashed, and are pending acknowledgement"
{{- end }}

{{- if not (.Values.prometheusRules.disabled.PrometheusJobMissing | default false) }}
  - alert: "PrometheusMgrJobMissing"
    expr: "absent(up{job=\"rook-ceph-mgr\"})"
    for: "2m"
    labels:
      service: ceph
      oid: "1.3.6.1.4.1.50495.1.2.1.12.2"
      severity: "warning"
      type: "ceph_default"
      {{- include "cloud-storage-operations.additionalRuleLabels" . | nindent 6 }}
    annotations:
      description: "The prometheus job that scrapes from Ceph MGR is no longer defined, this will effectively mean you'll have no metrics or alerts for the cluster.  Please review the job definitions in the prometheus.yml file of the prometheus instance."
      summary: "The scrape job for Ceph MGR is missing from Prometheus"
{{- end }}

{{- if not (.Values.prometheusRules.disabled.PrometheusJobExporterMissing | default false) }}
  - alert: "PrometheusJobExporterMissing"
    expr: "sum(absent(up{job=\"rook-ceph-exporter\"})) and sum(ceph_osd_metadata{ceph_version=~\"^ceph version (1[89]|[2-9][0-9]).*\"}) > 0"
    for: "2m"
    labels:
      service: ceph
      oid: "1.3.6.1.4.1.50495.1.2.1.12.3"
      severity: "warning"
      type: "ceph_default"
      {{- include "cloud-storage-operations.additionalRuleLabels" . | nindent 6 }}
    annotations:
      description: "The prometheus job that scrapes from Ceph Exporter is no longer defined, this will effectively mean you'll have no metrics or alerts for the cluster.  Please review the job definitions in the prometheus.yml file of the prometheus instance."
      summary: "The scrape job for Ceph Exporter is missing from Prometheus"
{{- end }}

{{- if not (.Values.prometheusRules.disabled.CephMgrServiceScrapeIssue | default false) }}
  - alert: "CephMgrServiceScrapeIssue"
    expr: up{service="rook-ceph-mgr"} == 0
    for: "2m"
    labels:
      service: ceph
      oid: "1.3.6.1.4.1.50495.1.2.1.12.4"
      severity: "warning"
      type: "ceph_default"
      {{- include "cloud-storage-operations.additionalRuleLabels" . | nindent 6 }}
    annotations:
      description: "The ServiceMonitor target 'rook-ceph-mgr' is not responding to Prometheus for more than 2 minutes."
      summary: "The scrape job for Ceph MGR is missing from Prometheus"
{{- end }}

{{- if not (.Values.prometheusRules.disabled.CephExporterServiceScrapeIssue | default false) }}
  - alert: "CephExporterServiceScrapeIssue"
    expr: up{service="rook-ceph-exporter"} == 0
    for: "2m"
    labels:
      service: ceph
      oid: "1.3.6.1.4.1.50495.1.2.1.12.5"
      severity: "warning"
      type: "ceph_default"
      {{- include "cloud-storage-operations.additionalRuleLabels" . | nindent 6 }}
    annotations:
      description: "The ServiceMonitor target 'rook-ceph-exporter' is not responding to Prometheus for more than 2 minutes."
      summary: "CephExporterService is having scrape issue"
{{- end }}

{{- if not (.Values.prometheusRules.disabled.CephOSDOOMKilled | default false) }}
  - alert: "CephOSDOOMKilled"
    expr: |
      increase(kube_pod_container_status_restarts_total{
        namespace="rook-ceph", pod=~"rook-ceph-osd-.*"}[15m]) > 0
      and on(pod)
      kube_pod_container_status_last_terminated_reason{
        namespace="rook-ceph", pod=~"rook-ceph-osd-.*",
        reason="OOMKilled"} == 1
    for: "1m"
    labels:
      service: ceph
      severity: "warning"
      type: "ceph_default"
      {{- include "cloud-storage-operations.additionalRuleLabels" . | nindent 6 }}
    annotations:
      summary: "Ceph OSD OOMKilled - recovery wave incoming"
      description: "OSD pod {{ $labels.pod }} was OOMKilled. This will trigger PG backfill and inter-AZ traffic spike.
{{- end }}

{{- if not (.Values.prometheusRules.disabled.CephOSDPodRestartingFrequently | default false) }}
  - alert: "CephOSDPodRestartingFrequently"
    expr: |
      increase(kube_pod_container_status_restarts_total{
        namespace="rook-ceph", pod=~"rook-ceph-osd-.*"}[1h]) > 1
    for: "5m"
    labels:
      service: ceph
      severity: "warning"
      type: "ceph_default"
      {{- include "cloud-storage-operations.additionalRuleLabels" . | nindent 6 }}
    annotations:
      summary: "Ceph OSD pod restarting frequently"
      description: "OSD pod {{ $labels.pod }} has restarted {{ $value }} times in the last hour."
{{- end }}

{{- if not (.Values.prometheusRules.disabled.CephOSDRestartingDaily | default false) }}
  - alert: "CephOSDRestartingDaily"
    expr: |
      increase(kube_pod_container_status_restarts_total{
        namespace="rook-ceph", pod=~"rook-ceph-osd-.*"}[24h]) >= 2
    for: "5m"
    labels:
      service: ceph
      severity: "critical"
      type: "ceph_default"
      {{- include "cloud-storage-operations.additionalRuleLabels" . | nindent 6 }}
    annotations:
      summary: "Ceph OSD restarting multiple times per day"
      description: "OSD pod {{ $labels.pod }} has restarted {{ $value }} times in the last 24 hours. Immediate investigation required."
{{- end }}

{{- if not (.Values.prometheusRules.disabled.CephOSDRestartingWeekly | default false) }}
  - alert: "CephOSDRestartingWeekly"
    expr: |
      increase(kube_pod_container_status_restarts_total{
        namespace="rook-ceph", pod=~"rook-ceph-osd-.*"}[7d]) >= 2 
    for: "5m"
    labels:
      service: ceph
      severity: "critical"
      type: "ceph_default"
      {{- include "cloud-storage-operations.additionalRuleLabels" . | nindent 6 }}
    annotations:
      summary: "Ceph OSD has restarted 3+ times this week"
      description: "OSD pod {{ $labels.pod }} has restarted {{ $value }} times in 7 days. Root cause not fixed — check OMAP bloat and memory limits."
{{- end }}
{{- end }}
